<style>
:root{--paper:#F3F6F1;--surface:#fff;--ink:#13201A;--ink2:#44524A;--mute:#66736B;--line:#DCE3DD;--leaf:#177A3E;--leaf-ink:#0F5A2D;--leaf-soft:#E2F1E7;--forest:#0E3B28;--forest2:#185037;--on-forest:#F3FBF6;--on-forest2:#B8D8C5;--tur:#F2B33D;--tur-ink:#4A3200;--chili:#C2410C;--chili-soft:#FCEBE2;--sky:#1D5FBF;--sky-soft:#E5EEFB;--red:#B42318;
 --tx:var(--ink);--t2:var(--ink2);--mu:var(--mute);--bd:var(--line);--ln:var(--line);--cd:var(--surface);--p:var(--leaf);--pt:var(--leaf-ink);--pl:var(--leaf-soft);--or:var(--chili);--ot:#7A2A08;--ol:var(--chili-soft);--bl:var(--sky);--bll:var(--sky-soft);--yl:#FFF4D6;--yt:#5A4300;
 --sh:0 1px 2px rgba(19,32,26,.06);color-scheme:light}

:root[data-theme="dark"]{--paper:#0D1411;--surface:#16201B;--ink:#E7EEE9;--ink2:#C2CEC6;--mute:#93A198;--line:#27342D;--leaf:#2FA35C;--leaf-ink:#7FD9A2;--leaf-soft:#173323;--forest:#13432D;--forest2:#1C5A3D;--chili:#F0875A;--chili-soft:#3A1E12;--sky:#8DB6F2;--sky-soft:#17263C;--red:#F07A6E;--ot:#F6B593;--yl:#2C2410;--yt:#F3DC97;--sh:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 "Fira Sans",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.d{font-family:"Fira Sans",system-ui,sans-serif;letter-spacing:-.015em}
h1,h2,h3,p{margin:0}
button,a.btn{font:inherit;cursor:pointer;border-radius:14px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:0 14px;font-weight:600}
button.pri,a.pri{background:var(--leaf);border-color:var(--leaf);color:#fff}
button.warnf{background:var(--chili);border-color:var(--chili);color:#fff}
button.ghost{background:transparent;border-color:transparent;color:var(--ink2);font-weight:500}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #2f7de1;outline-offset:2px}
.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
body.hasbar .wrap{padding-bottom:calc(178px + env(safe-area-inset-bottom))}
.mu{color:var(--mute);font-size:14px}
.row{display:flex;align-items:center;gap:10px}
[hidden]{display:none!important}
/* header */
.hd{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
.who{flex:1;min-width:0}
.hd .nm{font-size:23px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .mu{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.duty{flex:none;white-space:nowrap;border-radius:99px;min-height:42px;padding:0 14px 0 10px;font-size:15px;gap:8px;color:var(--ink2)}
.duty .dot{width:22px;height:22px;border-radius:50%;background:var(--line);position:relative;flex:none}
.duty.on{background:var(--leaf-soft);border-color:transparent;color:var(--leaf-ink)}
.duty.on .dot{background:var(--leaf);box-shadow:inset 0 0 0 6px var(--leaf),inset 0 0 0 11px #fff}
/* progress line */
.pg{display:flex;align-items:center;gap:12px;margin:0 2px 16px}
.pg-n{font-size:15px;color:var(--ink2);white-space:nowrap}.pg-n b{font-size:22px;color:var(--ink);font-weight:700}
.pg-bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden;min-width:40px}.pg-bar i{display:block;height:100%;background:var(--leaf);border-radius:99px}
.cashlink{min-height:36px;border-radius:99px;padding:0 12px;font-size:14px;border:0;background:#FBE7B8;color:var(--tur-ink);white-space:nowrap}
:root[data-theme="dark"] .cashlink{background:#3A2E12;color:#F6D58A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cashlink{background:#3A2E12;color:#F6D58A}}
/* the ticket: the one bold thing */
.tk{background:var(--forest);color:var(--on-forest);border-radius:22px;padding:18px 18px 16px;margin-bottom:22px;box-shadow:0 10px 24px -14px rgba(14,59,40,.55)}
.tk-top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px;color:var(--on-forest2);font-weight:500}
.tk-name{font-size:32px;line-height:1.08;font-weight:800;margin:8px 0 6px;overflow-wrap:break-word;letter-spacing:-.01em}
.tk-addr{font-size:17px;color:var(--on-forest);display:flex;gap:8px;align-items:flex-start}.tk-addr .i{color:var(--on-forest2);margin-top:2px}
.tk-pin{font-size:14px;color:var(--on-forest2)}
.tk-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 12px;font-size:15px;font-weight:600;background:var(--forest2);color:var(--on-forest)}
.chip.money{background:var(--tur);color:var(--tur-ink);font-size:17px;font-weight:700}
.chip.warn{background:#F7C9B4;color:#6B230A}.chip.ok{background:#CDEBD8;color:#0F4A27}
.tk-note{margin-top:12px;background:var(--forest2);border-radius:12px;padding:10px 12px;font-size:16px;color:var(--on-forest)}
.tk-acts{display:grid;grid-template-columns:minmax(0,1fr) 56px 76px;gap:8px;margin-top:16px}
.tk-acts .go{background:#fff;color:var(--forest);border:0;min-height:56px;font-size:19px;font-weight:700;border-radius:16px}
.tk-acts .sq{background:var(--forest2);color:var(--on-forest);border:0;min-height:56px;padding:0;border-radius:16px;flex-direction:column;gap:0;font-size:12px;font-weight:600}
:root[data-theme="dark"] .tk-acts .go{background:#E9F5EE}
.tk .pick{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid rgba(255,255,255,.14);min-height:56px}
.tk .pick:first-of-type{border-top:0}
.tk .pick input{width:26px;height:26px;accent-color:#F2B33D;margin:0;flex:none}
.tk .pick b{font-weight:600;font-size:17px}.tk .pick span span{color:var(--on-forest2);font-size:14px}
.tk .big-go{width:100%;margin-top:14px;min-height:58px;background:#fff;color:var(--forest);border:0;font-size:19px;font-weight:700;border-radius:16px}
.tk .big-go:disabled{opacity:1;background:var(--forest2);color:var(--on-forest2)}
.tk-done{text-align:left}
/* quiet sections */
.sec{display:flex;align-items:baseline;gap:8px;font-size:17px;font-weight:700;margin:22px 2px 6px}
.sec .n{font-size:15px;color:var(--mute);font-weight:500}
.sec .act{margin-left:auto;min-height:36px;border:0;background:none;color:var(--leaf-ink);font-size:15px;padding:0 4px}
.rl{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.li{display:flex;align-items:center;justify-content:flex-start;gap:14px;width:100%;min-height:64px;padding:10px 4px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;text-align:left;font-weight:400;color:var(--ink)}
.li .t{flex:1;min-width:0}.li b{display:block;font-weight:600;font-size:17px}.li .t span{display:block;color:var(--mute);font-size:14px}
.li .r{text-align:right;flex:none}.li .r b{font-size:17px}
.num{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;border:2px solid var(--leaf);color:var(--leaf-ink)}
.num.d{border:0;background:var(--leaf-soft);color:var(--leaf-ink)}.num.x{border:0;background:var(--chili-soft);color:var(--chili)}
.st{font-size:14px;font-weight:600;white-space:nowrap}.st.g{color:var(--leaf-ink)}.st.o{color:var(--chili)}.st.b{color:var(--sky)}.st.n{color:var(--mute)}
details.done>summary{list-style:none;cursor:pointer}details.done>summary::-webkit-details-marker{display:none}
details.done>summary .chev{margin-left:auto;transition:transform .2s}details.done[open]>summary .chev{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){details.done>summary .chev{transition:none}}
/* plain blocks (cash, me) */
.fig{margin:4px 2px 18px}.fig .mu{font-size:15px}.fig .v{font-size:50px;line-height:1;font-weight:800;margin:6px 0 6px;letter-spacing:-.01em}.fig p{color:var(--ink2);font-size:16px}
.fig .v.g{color:var(--leaf-ink)}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 0 6px}
.split.s3{grid-template-columns:repeat(3,minmax(0,1fr))}
.split>div{padding:12px 4px 12px 14px;border-left:1px solid var(--line)}.split>div:first-child{border-left:0;padding-left:4px}
.split span{display:block;color:var(--mute);font-size:14px}.split b{font-size:24px;font-weight:700;line-height:1.2}
.foot{color:var(--mute);font-size:14px;margin:12px 4px 0}
.mehd{display:flex;align-items:center;gap:14px;margin:0 2px 18px}
.avl{width:56px;height:56px;border-radius:18px;background:var(--forest);color:var(--on-forest);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;flex:none}
.mehd b{font-size:22px;font-weight:700;display:block;line-height:1.2}
.lk{display:flex;align-items:center;justify-content:flex-start;gap:14px;width:100%;min-height:60px;padding:10px 4px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;color:var(--ink);text-decoration:none;text-align:left;font-weight:400}
.lk .ic{width:40px;height:40px;border-radius:12px;background:var(--leaf-soft);color:var(--leaf-ink);display:flex;align-items:center;justify-content:center;flex:none}
.lk b{display:block;font-weight:600;font-size:17px}.lk .t span{color:var(--mute);font-size:14px}
/* action bar + menu */
.bot{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);padding:10px 14px;z-index:20}
.bot .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.6fr);gap:8px}
.bot button{min-height:56px;font-size:16px;min-width:0;padding:0 8px;white-space:nowrap}
.bot .warn{color:var(--chili);border-color:color-mix(in srgb,var(--chili) 45%,transparent)}
.bot .pri{font-size:18px;font-weight:700}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:22;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.nav button{border:0;border-radius:0;background:transparent;min-height:64px;flex-direction:column;gap:2px;padding:6px 2px;color:var(--mute);font-weight:500;font-size:13px}
.nav .ni{position:relative;display:flex;align-items:center;justify-content:center;width:58px;height:30px;border-radius:99px}
.nav button.on{color:var(--leaf-ink);font-weight:700}.nav button.on .ni{background:var(--leaf-soft)}
.nav .nb{position:absolute;top:-7px;left:calc(50% + 7px);background:var(--chili);color:#fff;font-size:11px;font-weight:700;line-height:17px;min-width:17px;padding:0 5px;border-radius:99px;white-space:nowrap}
.nav .nb.m{background:var(--tur);color:var(--tur-ink)}
/* sheets, toast, map (kept) */
.ovl{position:fixed;inset:0;background:rgba(8,16,12,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.hdl{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet h2{margin:0;font-size:24px;font-weight:700}
.sheet .eb{font-size:15px;color:var(--mute);font-weight:500}
.thb{min-height:44px;width:44px;padding:0;border-radius:22px;flex:none}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{min-height:44px;border:0;background:transparent;color:var(--ink2);font-weight:500}.seg button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--sh)}
.opt{width:100%;justify-content:flex-start;margin-top:8px;font-weight:500;text-align:left;padding:8px 14px;min-height:52px;flex-direction:column;align-items:flex-start;gap:0}
.opt.on{border:2px solid var(--chili);background:var(--chili-soft);color:var(--ot);font-weight:700}
.opt small{font-size:13px;color:var(--mute);font-weight:400}
.big{font-size:48px;font-weight:700;line-height:1.05}
.note{background:var(--yl);color:var(--yt);border-radius:12px;padding:10px 12px;font-size:15px;margin-top:8px;white-space:pre-line}
.card{background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:var(--sh);margin-bottom:12px}
input[type=text],input[type=number]{width:100%;min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:18px;padding:0 14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top));background:#13201A;color:#fff;border-radius:14px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;z-index:60;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.3);font-size:15px}
#toast.bad{background:#8a2f12}#toast button{min-height:40px;background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff}
#map{height:calc(100vh - 250px - env(safe-area-inset-bottom));min-height:300px;border-radius:20px;overflow:hidden;background:var(--line)}
.pin{width:30px;height:30px;border-radius:50%;background:#fff;border:2.5px solid #177A3E;color:#0F5A2D;display:flex;align-items:center;justify-content:center;font:700 14px "Fira Sans",sans-serif}
.pin.cur{background:#0E3B28;color:#fff;width:40px;height:40px;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.pin.done{background:#c9d9cf;border-color:#fff;color:#3f4a44}
.me{width:18px;height:18px;border-radius:50%;background:#2f7de1;border:3px solid #fff;box-shadow:0 0 0 8px rgba(47,125,225,.25)}
:root[data-theme="dark"] .leaflet-tile{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .leaflet-tile{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}}
.ctr{text-align:center;padding:40px 20px}
.sync{font-size:13px;color:var(--mute);text-align:center;margin-top:14px}
.av{width:44px;height:44px;border-radius:14px;background:var(--forest);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;flex:none}
@media (max-width:380px){
 .wrap{padding-left:12px;padding-right:12px}
 .hd .nm{font-size:20px}.duty{padding:0 10px 0 8px;font-size:14px}
 .tk{padding:16px 14px 14px}.tk-name{font-size:28px}
 .tk-acts{grid-template-columns:minmax(0,1fr) 52px 66px}
 .bot{padding-left:10px;padding-right:10px}.bot .in{gap:6px}
 .bot button{flex-direction:column;gap:2px;font-size:14px;min-height:58px;padding:0 4px}.bot .pri{font-size:16px}
 .fig .v{font-size:44px}.split b{font-size:21px}.nav .ni{width:50px}
}
</style>

<div id="toast" role="status" aria-live="polite" hidden></div>
<script>
'use strict';
const SB='https://rhzxfkxqgqzmczuqcskh.supabase.co/rest/v1/rpc/';
const KEY='sb_publishable_Vy-ow2w0RPmSdutT-4mzKQ_Vt8b8YDT';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const tm=t=>t?new Date(t).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}):'';
const P={list:'<path d="M9 6h12M9 12h12M9 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/>',map:'<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',wallet:'<path d="M3 7h15a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z"/><path d="M3 7l12-3v3"/><circle cx="16.5" cy="13.5" r="1.2"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',nav:'<path d="M3 11l18-8-8 18-2-8z"/>',call:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',chat:'<path d="M4 5h16v11H9l-5 4z"/>',check:'<path d="M5 12l5 5 9-10"/>',alert:'<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/>',bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21h4"/>',route:'<circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7.5a3.5 3.5 0 0 0 0-7h-7a3.5 3.5 0 0 1 0-7H16"/>',pin:'<path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/>',moon:'<path d="M20 14.2A8 8 0 0 1 9.8 4a8 8 0 1 0 10.2 10.2z"/>',refresh:'<path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;

// ---------- link code ----------
function codeFromHash(){const m=/(?:^|[#&])t=([0-9a-f]{32,128})/i.exec(location.hash);return m?m[1]:''}
let T=codeFromHash();
try{if(T)localStorage.setItem('nzRider',T);else{T=localStorage.getItem('nzRider')||'';if(T)history.replaceState(null,'','#t='+T)}}catch(e){}

// ---------- state ----------
let tab='today',SUM=null,sumAt=0,sumBusy=false,sumErr=false;try{tab=sessionStorage.getItem('nzTab')||'today';SUM=JSON.parse(localStorage.getItem('nzSum')||'null')}catch(e){}
let D=null,bad=false,netErr=false,sel=null,view='list',picked={},sheet=null,lastLoad=0,busy=false,map=null,mapLayer=null,leafletP=null;
let Q=[];try{Q=JSON.parse(localStorage.getItem('nzQ')||'[]');Q.forEach(a=>{delete a.hold})}catch(e){Q=[]}

async function rpc(fn,body){
  const r=await fetch(SB+fn,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const t=await r.text();let j=null;try{j=JSON.parse(t)}catch(e){}
  if(!r.ok){const e=new Error((j&&j.message)||('Server error '+r.status));e.server=true;throw e}
  return j;
}

// ---------- location ----------
let pos=null,geoId=null,lastPing=0;
function startGeo(){if(geoId!==null||!navigator.geolocation)return;try{geoId=navigator.geolocation.watchPosition(p=>{pos={la:p.coords.latitude,ln:p.coords.longitude,at:Date.now()}},()=>{},{enableHighAccuracy:true,maximumAge:30000,timeout:20000})}catch(e){}}

function freshPos(){return pos&&Date.now()-pos.at<120000?pos:null}
function getPos(ms){const f=freshPos();if(f||!navigator.geolocation)return Promise.resolve(f);return new Promise(res=>{let done=false;const fin=v=>{if(!done){done=true;res(v)}};setTimeout(()=>fin(null),ms||4000);try{navigator.geolocation.getCurrentPosition(p=>{pos={la:p.coords.latitude,ln:p.coords.longitude,at:Date.now()};fin(pos)},()=>fin(null),{enableHighAccuracy:true,maximumAge:30000,timeout:ms||4000})}catch(e){fin(null)}})}

// ---------- actions (saved first, sent when there is internet) ----------
function applyLocal(a){
  if(!D)return;const s=a.o?D.stops.find(x=>x.id===a.o):null;const now=new Date(a.ts).toISOString();
  if(a.k==='duty_on'||a.k==='duty_off')D.rider.on_duty=a.k==='duty_on';
  else if(a.k==='picked_up')D.stops.forEach(x=>{if(x.status==='New'||x.status==='Preparing'){x.status='Out for delivery';x.picked_up_at=now}});
  else if(s){
    if(a.k==='at_gate')s.at_gate_at=now;
    else if(a.k==='delivered'){s.status='Delivered';s.delivered_at=now}
    else if(a.k==='problem'){s.status='Delayed';s.delay_reason=a.r}
    else if(a.k==='returned'){s.status='Rejected';s.returned=true;s.amount=0;s.collect=0;s.delay_reason=a.r||'Customer not at home'}
    else if(a.k==='collected'){s.paid=true;s.collect=0;if(a.m==='Cash')D.cash_with_you=Number(D.cash_with_you||0)+Number(a.am||0);D.payments=D.payments||[];if(!D.payments.some(x=>x.id==='local-'+a.id))D.payments.unshift({id:'local-'+a.id,customer:s.customer,amount:Number(a.am||0),method:a.m,at:now,date:D.date,handed:false,checked:false})}
  }
}
function act(k,o,extra){
  const p=freshPos(),need=!p&&(k==='delivered'||k==='at_gate'||k==='returned'||k==='picked_up');
  const a=Object.assign({id:Math.random().toString(36).slice(2),k,o:o||null,ts:Date.now(),la:p?p.la:null,ln:p?p.ln:null},need?{hold:1}:{},extra||{});
  Q.push(a);saveQ();applyLocal(a);cacheD();render();
  if(need)getPos(3500).then(q=>{if(q){a.la=q.la;a.ln=q.ln}delete a.hold;saveQ();flush()});else flush();
  return a;
}
async function flush(){
  if(busy||!Q.length)return;busy=true;let reload=false;
  try{
    while(Q.length){
      const a=Q[0];if(a.hold)break;if(a.after&&Date.now()<a.after){setTimeout(flush,a.after-Date.now()+50);break}
      try{await rpc('rider_act',{p_token:T,p_action:a.k,p_order:a.o,p_lat:a.la,p_lng:a.ln,p_reason:a.r||null,p_amount:a.am==null?null:a.am,p_method:a.m||null});Q.shift();saveQ();netErr=false}
      catch(e){if(e.server){Q.shift();saveQ();toast(e.message,null,true);reload=true}else{netErr=true;break}}
    }
  }finally{busy=false}
  renderSync();if(reload)load(true);
}
function cacheD(){try{localStorage.setItem('nzD',JSON.stringify(D))}catch(e){}}

// ---------- load ----------
async function load(force){
  if(!T){bad=true;render();return}
  try{
    const d=await rpc('rider_today',{p_token:T});
    D=d;bad=false;netErr=false;lastLoad=Date.now();
    Q.forEach(applyLocal);cacheD();
    if(D.rider&&D.rider.on_duty)startGeo();
  }catch(e){if(e.server&&/Link not valid/i.test(e.message)){bad=true;try{localStorage.removeItem('nzRider')}catch(x){}}else netErr=true}
  if((!sheet&&tab!=='map')||force)render();else renderSync();
}

// ---------- helpers ----------

function phone91(p){p=String(p||'').replace(/\D/g,'');return p.length===10?'91'+p:p}
function place(s){return s.lat!=null&&s.lng!=null?`${s.lat},${s.lng}`:[s.address,s.area,'Coimbatore'].filter(Boolean).join(', ')}
function navUrl(s){return 'https://www.google.com/maps/dir/?api=1&travelmode=driving&dir_action=navigate&destination='+encodeURIComponent(place(s))}
function routeUrl(list){const d=list[list.length-1],w=list.slice(0,-1);return 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+encodeURIComponent(place(d))+(w.length?'&waypoints='+encodeURIComponent(w.map(place).join('|')):'')}
function waUrl(s){const first=String(s.customer||'').split(' ')[0];const who=D&&D.rider?D.rider.name:'your rider';return 'https://wa.me/'+phone91(s.phone)+'?text='+encodeURIComponent(`Hi ${first}, this is ${who} from Team Nutryzo. I'm about 5 minutes away with your meal.`)}
function dateLabel(d){try{return new Date(d+'T00:00:00').toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'short'})}catch(e){return d}}

  const off=X&&X.office||{},ph=String(off.phone||'').replace(/[^\d+]/g,'');
  h+=`<h3 class="sec">Help and settings</h3><div class="rl">
  ${ph?`<a class="lk" href="tel:${esc(ph)}"><span class="ic">${ic('call')}</span><span class="t"><b>Call the office</b><span>${esc(off.phone)}</span></span></a><a class="lk" href="https://wa.me/${esc(phone91(ph))}" target="_blank" rel="noopener"><span class="ic">${ic('chat')}</span><span class="t"><b>WhatsApp the office</b></span></a>`:''}
  <button class="lk" onclick="toggleTheme()"><span class="ic">${ic(dark?'sun':'moon')}</span><span class="t"><b>${dark?'Day mode':'Night mode'}</b><span>${dark?'Brighter screen for daylight':'Darker screen for early mornings'}</span></span></button>
  <div class="lk"><span class="ic">${ic('pin')}</span><span class="t"><b>Open this app with one tap</b><span>In Chrome, tap ⋮ and then "Add to Home screen".</span></span></div></div>`;
  return h;
}

// ---------- user actions ----------
function tick(id,v){picked[id]=v;const btn=document.getElementById('pickbtn');if(btn)btn.disabled=!stops().filter(waiting).every(s=>picked[s.id])}
function pickUp(){if(!D.rider.on_duty){startGeo();act('duty_on')}act('picked_up');picked={};render();toast('Picked up. Have a safe ride!')}
async function toggleDuty(){if(!D)return;const on=!(D.rider&&D.rider.on_duty);if(on)startGeo();act(on?'duty_on':'duty_off');if(!on)stopGeo();toast(on?'You are on duty. Your location is shared with the office while on duty.':'You are off duty. Location sharing stopped.')}
function pick(id){sel=id;window.scrollTo({top:0,behavior:'smooth'});render()}
function setView(v){setTab(v==='map'?'map':'today')}
function atGate(id){act('at_gate',id);toast('Customer told you are at the gate')}
function delivered(id){
  const s=stops().find(x=>x.id===id);if(!s)return;
  if(Number(s.collect)>0){openCollect(id);return}
  finishDelivered(id);
}
function finishDelivered(id){
  const s0=stops().find(x=>x.id===id),prev=s0?s0.status:'Out for delivery';
  const a=act('delivered',id,{after:Date.now()+5000});sel=null;render();
  toast('Delivered ✓','Undo',false,()=>{const i=Q.findIndex(x=>x.id===a.id);if(i>=0){Q.splice(i,1);saveQ();const s=stops().find(x=>x.id===id);if(s){s.status=prev;s.delivered_at=null}cacheD();render();toast('Undone')}else toast('Already sent. Ask the office to change it.',null,true)},5000);
}
function openCollect(id){
  const s=stops().find(x=>x.id===id);sheet={k:'collect',id,m:'Cash',amt:Number(s.collect)};drawSheet();
}
function openProblem(id){sheet={k:'problem',id,r:''};drawSheet()}
function closeSheet(){sheet=null;$('#ovl').hidden=true;$('#ovl').innerHTML='';render()}
const REASONS=['Customer not answering','Customer not at home','Can\'t find the address','Customer refused the order','Food spilled or damaged','Running late (traffic)'];
function drawSheet(){
  const o=$('#ovl');if(!sheet){o.hidden=true;return}
  const s=stops().find(x=>x.id===sheet.id);if(!s){closeSheet();return}
  let h='';
  if(sheet.k==='collect'){
    h=`<div class="row" style="justify-content:space-between;align-items:flex-start"><div><div class="eb">Collect payment</div><h2>${esc(s.customer)}</h2></div><button class="thb" onclick="closeSheet()" aria-label="Close">${ic('x')}</button></div>
    <div style="text-align:center;margin:14px 0"><div class="big">${inr(sheet.amt)}</div><div class="mu">${esc(s.items||'')}</div></div>
    <div class="seg"><button class="${sheet.m==='Cash'?'on':''}" onclick="sheet.m='Cash';drawSheet()">Cash</button><button class="${sheet.m==='UPI'?'on':''}" onclick="sheet.m='UPI';drawSheet()">UPI</button></div>
    ${sheet.m==='UPI'?'<div class="note" style="margin:0 0 10px">Ask the customer to pay Nutryzo by UPI, and tap the button once you see it is paid.</div>':''}
    <label for="amt" class="mu">Amount received (₹)</label><input id="amt" type="number" inputmode="numeric" min="1" value="${sheet.amt}" oninput="sheet.amt=Number(this.value)||0">
    <button class="pri" style="width:100%;margin-top:14px;min-height:56px" onclick="doCollect()">${ic('check')}Got ${inr(sheet.amt)} by ${sheet.m} · Delivered</button>
    <button class="ghost" style="width:100%;margin-top:6px" onclick="payLater()">Customer will pay later · Delivered</button>`;
  }else{
    const ret=sheet.r==='Customer not at home';
    h=`<div class="row" style="justify-content:space-between;align-items:flex-start"><div><h2>What's the problem?</h2><div class="mu">${esc(s.customer)}</div></div><button class="thb" onclick="closeSheet()" aria-label="Close">${ic('x')}</button></div>
    ${REASONS.map((t,i)=>`<button class="opt ${sheet.r===t?'on':''}" onclick="sheet.r=REASONS[${i}];drawSheet()">${sheet.r===t?'✓ ':''}${esc(t)}${i===0&&s.instructions?`<small>Their note: ${esc(s.instructions)}</small>`:''}</button>`).join('')}
    <label for="pn" class="mu" style="display:block;margin-top:12px">Add a note (optional)</label><input id="pn" type="text" maxlength="120" placeholder="e.g. Called twice, no answer" value="${esc(sheet.n||'')}" oninput="sheet.n=this.value">
    ${ret?`<div class="card" style="background:var(--ln);box-shadow:none;margin:12px 0 0"><b style="font-weight:600">What happens next</b><div>Take the meal back to the kitchen.</div><div>The customer is <b>not charged</b>.${s.payment_mode==='Prepaid'?' Their plan gets <b>1 extra day</b>.':''}</div></div>`:''}
    <button class="${ret?'warnf':'pri'}" style="width:100%;margin-top:14px;min-height:56px" ${sheet.r?'':'disabled'} onclick="doProblem()">${ret?'Return to kitchen':'Send to office'}</button>`;
  }
  o.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="hdl"></div>${h}</div>`;o.hidden=false;
  o.onclick=e=>{if(e.target===o)closeSheet()};
}
function doCollect(){const s=sheet;if(!(s.amt>0)){toast('Enter the amount',null,true);return}sheet=null;$('#ovl').hidden=true;act('collected',s.id,{am:s.amt,m:s.m});act('delivered',s.id);sel=null;render();toast(`Delivered ✓ · ${inr(s.amt)} by ${s.m}`)}
function payLater(){const id=sheet.id;sheet=null;$('#ovl').hidden=true;finishDelivered(id)}
function doProblem(){const s=sheet;const reason=s.r+(s.n&&s.n.trim()?' — '+s.n.trim():'');sheet=null;$('#ovl').hidden=true;
  if(s.r==='Customer not at home'){act('returned',s.id,{r:reason});toast('Marked as returned. Take the meal back to the kitchen.')}
  else{act('problem',s.id,{r:reason});toast('The office has been told')}
  sel=null;render();}
function toggleTheme(){const r=document.documentElement,dark=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);const t=dark?'light':'dark';r.setAttribute('data-theme',t);try{localStorage.setItem('nzTheme',t)}catch(e){}render()}

// ---------- toast ----------
let tT=null;
function toast(msg,btn,isBad,fn,ms){const t=$('#toast');clearTimeout(tT);t.className=isBad?'bad':'';t.innerHTML=`<span>${esc(msg)}</span>${btn?`<button type="button">${esc(btn)}</button>`:''}`;if(btn)t.querySelector('button').onclick=()=>{t.hidden=true;fn&&fn()};t.hidden=false;tT=setTimeout(()=>{t.hidden=true},ms||3500)}

// ---------- map (loads only when opened) ----------
function loadLeaflet(){if(window.L)return Promise.resolve();if(leafletP)return leafletP;leafletP=new Promise((res,rej)=>{const l=document.createElement('link');l.rel='stylesheet';l.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';l.integrity='sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=';l.crossOrigin='';document.head.appendChild(l);const s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.integrity='sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=';s.crossOrigin='';s.onload=res;s.onerror=()=>{leafletP=null;rej()};document.head.appendChild(s)});return leafletP}
async function drawMap(){
  const el=$('#map');if(!el)return;
  try{await loadLeaflet()}catch(e){el.innerHTML='<div class="ctr mu">Map could not load. Use Navigate instead.</div>';return}
  if(!$('#map'))return;
  if(map){map.remove();map=null}
  map=L.map('map',{zoomControl:true,attributionControl:true});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
  const all=stops(),c=cur(),pts=[];
  all.forEach((s,i)=>{if(s.lat==null||s.lng==null)return;const k=!isOpen(s)?'done':(c&&s.id===c.id?'cur':'');
    const m=L.marker([s.lat,s.lng],{icon:L.divIcon({className:'',html:`<div class="pin ${k}">${k==='done'?'✓':i+1}</div>`,iconSize:[38,38],iconAnchor:[19,19]}),title:s.customer,keyboard:true}).addTo(map);
    m.on('click',()=>{if(isOpen(s)){sel=s.id;setTab('today')}});pts.push([s.lat,s.lng])});
  const p=freshPos();if(p){L.marker([p.la,p.ln],{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]}),title:'You'}).addTo(map);pts.push([p.la,p.ln])}
  if(pts.length)map.fitBounds(pts,{padding:[40,40],maxZoom:16});else map.setView([11.0168,76.9558],12);
  const missing=all.filter(s=>isOpen(s)&&(s.lat==null||s.lng==null)).length;
  if(missing)el.insertAdjacentHTML('afterend',`<div class="mu" style="margin-top:8px">${missing} ${missing===1?'stop has':'stops have'} no map pin yet. Use Navigate on the list.</div>`);
}

// ---------- timers ----------
setInterval(()=>{if(document.visibilityState!=='visible')return;
  if(D&&D.rider&&D.rider.on_duty){const p=freshPos();if(p&&Date.now()-lastPing>60000&&!Q.length){lastPing=Date.now();rpc('rider_act',{p_token:T,p_action:'ping',p_lat:p.la,p_lng:p.ln}).catch(()=>{})}}
  if(!Q.length&&!sheet&&Date.now()-lastLoad>60000)load();
  flush();
},15000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){flush();if(Date.now()-lastLoad>15000)load()}});
window.addEventListener('online',()=>{netErr=false;flush();load()});
render();load();flush();
</script>
</body>
</html>
