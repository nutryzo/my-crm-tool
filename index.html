 return `<h1>Money / Finance</h1><div class="grid"><div class="card stat"><b>${inr(inc)}</b><span>Income</span></div><div class="card stat"><b>${inr(exp)}</b><span>Expense</span></div></div>

 ${S.t.length?S.t.map(x=>`<div class="card"><div class="top"><b>${esc(x.cat)}</b><span class="${x.type==='Expense'?'mu':''}">${x.type==='Expense'?'−':'+'}${inr(x.amt)}</span></div>

function home(){

function parseLoc(s){

 m=t.match(/[?&](?:q|ll|query|destination)=\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/i)||t.match(/\/place\/\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/)||t.match(/^\(?\s*(-?\d+(?:\.\d+)?)\s*[,\s]\s*(-?\d+(?:\.\d+)?)\s*\)?$/);
 if(m)return ok(+m[1],+m[2],'pin');
 m=t.match(/^(\d+(?:\.\d+)?)\s*\u00b0?\s*([NS])[\s,]+(\d+(?:\.\d+)?)\s*\u00b0?\s*([EW])$/i);
 if(m)return ok(+m[1]*(m[2].toUpperCase()==='S'?-1:1),+m[3]*(m[4].toUpperCase()==='W'?-1:1),'pin');

 const calm=()=>!CM.busy&&!CM.tm&&JSON.stringify(S)===before&&$('#md').hidden&&tab!=='plan'&&!(tab==='customers'&&/add|edit/.test(cv.v))&&!(document.activeElement&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName));
 try{if(await pull(calm)&&JSON.stringify(S)!==before){applyBiz();render()}}catch(e){}
}
document.addEventListener('visibilitychange',autoPull);setInterval(autoPull,60000);

/* ---- order status time is saved with the order ---- */
function setS(id,v){act('Marked '+v,()=>{const o=S.o.find(x=>x.id===id);o.status=v;o.sat=timeNow();o.satAt=new Date().toISOString()})}
function doDelay(id){const r=val('dr'),n=val('dn');closeMd();act('Marked delayed',()=>{const o=S.o.find(x=>x.id===id);o.status='Delayed';o.dlr=r+(n?': '+n:'');o.sat=timeNow();o.satAt=new Date().toISOString()})}

/* ---- one-time move of this browser's data to Supabase ---- */
function dlFile(text,name){const u=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function dlBackup(){let t='';try{t=localStorage.getItem('hfcrm_premigration')||localStorage.getItem('hfcrm')||''}catch(e){}if(!t)t=JSON.stringify(S);dlFile(t,'nutryzo-backup-'+today()+'.json');CM.bk=true;render();toast('Backup file downloaded')}
function dlNow(){dlFile(JSON.stringify(S),'nutryzo-data-'+today()+'.json');toast('Backup file downloaded')}
function remapIds(){
 const mp={},nu=x=>{if(x&&!isU(x.id)){x.lid=x.id;mp[x.id]=x.id=uid()}};
 S.d.forEach(nu);S.menu.s.forEach(nu);S.menu.d.forEach(nu);S.o.forEach(nu);S.t.forEach(nu);
 S.o.forEach(o=>{if(o.sid&&mp[o.sid])o.sid=mp[o.sid]});
 Object.values(S.plan).forEach(p=>{if(p.salad&&mp[p.salad])p.salad=mp[p.salad];if(p.drink&&mp[p.drink])p.drink=mp[p.drink]});
 if(pn.salad&&mp[pn.salad])pn.salad=mp[pn.salad];if(pn.drink&&mp[pn.drink])pn.drink=mp[pn.drink];
}
function expCounts(){const cs=cIds(),K=S.c.map(custKids);return{customers:S.c.length,customer_addresses:K.reduce((a,k)=>a+k.a.length,0),customer_pricing:K.reduce((a,k)=>a+k.p.length,0),customer_holidays:K.reduce((a,k)=>a+k.h.length,0),customer_activity_logs:K.reduce((a,k)=>a+k.l.length,0),delivery_staff:S.d.length,menu_items:S.menu.s.length+S.menu.d.length,daily_plans:Object.keys(S.plan).length,daily_plan_customers:Object.values(S.plan).reduce((a,p)=>a+planKids(p,cs).length,0),orders:S.o.length,order_items:S.o.reduce((a,o)=>a+orderKids(o).length,0),transactions:S.t.length}}
async function migrate(){
 const out=$('#mgp'),say=h=>{const o=$('#mgp');if(o)o.innerHTML=h};
 if(CM.mode!=='local'||!CM.bk)return;
 const btn=$('#mgb');if(btn)btn.disabled=true;
 try{
  say('Keeping a safety copy in this browser…');
  try{if(!localStorage.getItem('hfcrm_premigration'))localStorage.setItem('hfcrm_premigration',localStorage.getItem('hfcrm')||JSON.stringify(S))}catch(e){}
  norm();remapIds();try{localStorage.setItem('hfcrm',JSON.stringify(S))}catch(e){}
  say('Uploading your data to Supabase…');
  CM.mode='migrating';CM.SN=emptySN();
  const ok=await push();if(!ok)throw new Error(CM.err);
  say('Checking the database…');
  const exp=expCounts(),got={};
  for(const t of Object.keys(exp)){const{count,error}=await sb.from(t).select('*',{count:'exact',head:true});if(error)throw error;got[t]=count}
  const all=Object.keys(exp).every(t=>got[t]===exp[t]);
  const tbl=`<div class="tw"><table class="kt"><thead><tr><th>Table</th><th>In this browser</th><th>In database</th><th></th></tr></thead><tbody>${Object.keys(exp).map(t=>`<tr><td>${t}</td><td>${exp[t]}</td><td>${got[t]}</td><td>${got[t]===exp[t]?'✅':'❌'}</td></tr>`).join('')}</tbody></table></div>`;
  if(!all){CM.mode='local';CM.SN=null;CM.err='';cloudUi();say(`<div class="err">Some numbers do not match, so the app is still using this browser’s data. Nothing was deleted. Send a screenshot of this table.</div>${tbl}<div class="row"><button onclick="migrate()">Try again</button></div>`);if(btn)btn.disabled=false;return}
  const mv={done:true,at:new Date().toISOString(),by:sbUser&&sbUser.email||'',counts:exp};
  await sbx(sb.from('app_settings').upsert({key:'migration',value:mv,updated_at:mv.at},{onConflict:'key'}));
  CM.mig=mv;CM.mode='cloud';CM.SN=snap();CM.pulled=Date.now();CM.at=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});CM.done=tbl;
  render();toast('Your data is now in Supabase');
 }catch(e){CM.mode='local';CM.SN=null;CM.err='';cloudUi();say(`<div class="err">The move stopped: ${esc(eMsg(e))}. The app is still using this browser’s data, and nothing was deleted. You can press the button again.</div>`);if(btn)btn.disabled=false}
}
async function startEmpty(){
 if(CM.mode!=='local'||S.c.length||S.o.length||S.t.length)return;
 try{const mv={done:true,at:new Date().toISOString(),by:sbUser&&sbUser.email||'',counts:{}};await sbx(sb.from('app_settings').upsert({key:'migration',value:mv,updated_at:mv.at},{onConflict:'key'}));CM.mig=mv;await pull();CM.mode='cloud';applyBiz();render();toast('Now using the database')}
 catch(e){toast('Could not start: '+eMsg(e))}
}
async function reloadCloud(){if(CM.mode!=='cloud')return;if(CM.tm||CM.busy){toast('Still saving, try again in a moment');return}try{await pull();applyBiz();render();toast('Loaded the latest data')}catch(e){CM.err='Could not load: '+eMsg(e);cloudUi()}}
function cloudC(){
 const n=`${S.c.length} customers · ${S.o.length} orders · ${S.t.length} money entries · ${Object.keys(S.plan).length} meal plans`;
 if(CM.mode==='cloud')return `<div class="card"><div class="fsh">${ic('check',18)}<b>Database: connected</b></div><div class="mu">Every change is saved to Supabase automatically. Other phones and computers see it after you sign in there.</div><div style="margin:10px 0 4px">${n}</div>${CM.at?`<div class="mu">Last saved at ${esc(CM.at)}</div>`:''}${CM.done?`<details style="margin-top:8px"><summary class="mu">Move check results</summary>${CM.done}</details>`:''}<div class="row"><button class="s" onclick="reloadCloud()">Load latest data</button><button class="s" onclick="dlNow()">Download a backup file</button></div></div>`;
 if(CM.mode==='offline')return `<div class="card"><div class="fsh">${ic('x',18)}<b>Database: not connected</b></div><div class="err">${esc(CM.err)}</div><div class="row"><button onclick="retryInit()">Try again</button></div></div>`;
 if(CM.mode!=='local')return '';
 const none=!S.c.length&&!S.o.length&&!S.t.length;
 if(none)return `<div class="card"><div class="fsh">${ic('wallet',18)}<b>Move your data to Supabase</b></div><div class="mu">There is no data in this browser. If your data is on another computer, sign in there and move it from that computer’s Settings page.</div><div class="row"><button class="s" onclick="startEmpty()">Start using the database with no data</button></div></div>`;
 return `<div class="card mig"><div class="fsh">${ic('wallet',18)}<b>Move your data to Supabase</b></div><div class="mu">Right now your data is saved only in this browser: ${n}. Move it once, and after that every change is saved to the database.</div>
 <div class="stp"><i>1</i><b>Download a backup file</b>${CM.bk?'<span class="pill">Done</span>':''}</div><div class="mu">Keep this file safe. It is a full copy of your data as it is now.</div><div class="row"><button class="${CM.bk?'s':''}" onclick="dlBackup()">${ic('copy',16)}Download backup file</button></div>
 <div class="stp"><i>2</i><b>Move the data</b></div><div class="mu">Uploads everything, then counts every table to check nothing is missing. Your browser’s copy is kept.</div><div class="row"><button id="mgb" ${CM.bk?'':'disabled'} onclick="migrate()">${ic('check',16)}Move data to Supabase</button></div><div id="mgp" class="mu" style="margin-top:10px"></div></div>`;
}

 const u=sbUser||{},p=sbProf||{};
 return `<div class="card"><div class="fsh">${ic('user',18)}<b>Admin account</b></div><div class="mu" style="margin:0 0 8px">Signed in as ${esc(u.email||'-')}${p.full_name?' · '+esc(p.full_name):''}${p.role?' · '+esc(p.role):''}</div>
 <div class="row" style="margin:0 0 4px"><button class="s" onclick="sbTest()">Test database connection</button></div><div id="sbt" class="mu" style="margin-top:8px"></div>
 <label for="np">New password</label><input id="np" type="password" autocomplete="new-password"><label for="nq">Confirm new password</label><input id="nq" type="password" autocomplete="new-password"><p class="err" id="aerr"></p>
 <div class="row"><button onclick="chPw()">Change password</button><button class="s" onclick="logout()">Log out</button></div></div>`;
}
function rsBk(){if(CM.mode==='cloud'){err('Restoring a backup is turned off while you use the database, so it cannot overwrite newer data.');return}
 try{const d=JSON.parse(val('bk'));if(!d||!Array.isArray(d.c))throw 0;bak=JSON.stringify(S);S=Object.assign({c:[],o:[],d:[],t:[],plan:{},menu:{s:[],d:[]}},d);save();render();toast('Backup restored',1)}catch(e){err('That text is not a valid backup.')}}
function backupC(){return `<div class="card"><div class="fsh">${ic('copy',18)}<b>Backup as text</b></div><div class="mu" style="margin:0 0 8px">${CM.mode==='cloud'?'Copy all your data as text. Restoring is turned off while you use the database.':'Copy all your data as text, or paste a backup to restore it.'}</div><textarea id="bk" rows="4" aria-label="Backup data" placeholder="Backup text appears here."></textarea><p class="err" id="err"></p><div class="row"><button onclick="mkBk()">Create backup</button>${CM.mode==='cloud'?'':'<button class="s" onclick="rsBk()">Restore from text</button>'}</div></div>`}
function settingsV(){
 return pageHead('Settings','Business details, menu, team, messages, database and your account.')+`<div class="setg"><div class="stack">${bizC()}${teamC()}${tplC()}</div><div class="stack">${cloudC()}${acctC()}${backupC()}${window.claude?syncC():''}${skinC()}</div></div>`;
}

/* ===== Meal plan: what the bar offers after a plan is applied ===== */
const plFresh=o=>o.status==='New'&&!o.sid; // not yet assigned or started
const plOrd=d=>S.o.filter(o=>o.date===d&&o.pl===d);
const plSame=(o,w)=>o.items===w.items&&Number(o.amt)===w.amt&&Number(o.mpr||0)===w.mpr&&Number(o.dpr||0)===w.dpr;
function plOvK(ov,mp){return Object.keys(ov||{}).filter(k=>ov[k]).sort().map(k=>k+':'+Number((mp||{})[k]))}
function plKey(p){const s=p.salad||'',dr=p.drink||'';return JSON.stringify([s,s?Number(p.std)||0:0,dr,dr?Number(p.dstd)||0:0,dr?(p.dc||[]).slice().sort():[],s?plOvK(p.ov,p.mp):[],dr?plOvK(p.dov,p.dp):[]])}
function plWant(){
 const{el,sl,dk,dcs}=calc();
 const ids=[...new Set([...(sl?el:[]).map(c=>c.id),...dcs.map(c=>c.id)])];
 return ids.map(id=>{const c=cby(id),hs=!!sl,hd=dcs.some(x=>x.id===id),a=hs?pr(c,'m').p:0,b=hd?pr(c,'d').p:0;
  return{cid:id,items:[hs?'Salad: '+sl.name:'',hd?'Drink: '+dk.name:''].filter(Boolean).join(' + '),amt:a+b,mpr:a,dpr:b}});
}
function plSt(){
 const d=pn.date,p=S.plan[d];if(!p||(p.st||'Applied')!=='Applied')return null;
 const os=plOrd(d),W=plWant(),wm=new Map(W.map(w=>[w.cid,w])),has=new Set(os.map(o=>o.cid));
 const cur={salad:S.menu.s.some(x=>x.id===pn.salad)?pn.salad:'',std:pn.std,drink:S.menu.d.some(x=>x.id===pn.drink)?pn.drink:'',dstd:pn.dstd,dc:calc().dcs.map(c=>c.id),ov:pn.ov,mp:pn.mp,dov:pn.dov,dp:pn.dp};
 return{os,
  miss:W.filter(w=>!has.has(w.cid)),
  upd:os.filter(o=>plFresh(o)&&wm.has(o.cid)&&!plSame(o,wm.get(o.cid))),
  rem:os.filter(o=>plFresh(o)&&!wm.has(o.cid)),
  kept:os.filter(o=>!plFresh(o)&&open(o)&&(!wm.has(o.cid)||!plSame(o,wm.get(o.cid)))),
  setCh:plKey(cur)!==plKey(p)};
}
function plBar(ready,mr,dr,el,sl,dk,dcs,ds){
 const st=plSt();
 if(!st)return `<div class="pbar"><div><b class="tt">${inr(mr+dr)}</b><div class="mu">${sl?el.length+(el.length===1?' meal':' meals'):'No meal'}${dk?' · '+dcs.length+(dcs.length===1?' drink':' drinks'):''}${ds?' · discount '+inr(ds):''}</div></div><div class="row" style="margin:0"><button class="s" onclick="applyPlan(true)">Save draft</button><button ${ready?'':'disabled'} onclick="applyPlan(false)">${ic('check',18)}Apply to customers</button></div></div>`;
 const n=st.os.length,tot=st.os.reduce((a,o)=>a+(Number(o.amt)||0),0),ch=st.upd.length+st.rem.length,mi=st.miss.length;
 const left=note=>`<div><b class="tt okt">${ic('check',20)}Applied</b><div class="mu">${n} ${n===1?'order':'orders'} · ${inr(tot)}${note?' · '+note:''}</div></div>`;
 const view=cls=>`<button ${cls?'class="s"':''} onclick="go('orders')">View orders</button>`;
 const disc=st.setCh?`<button class="s" onclick="plDiscard()">Discard changes</button>`:'';
 let L,R;
 if(ch){L=left(`<span class="wt">${ch} ${ch===1?'order needs':'orders need'} updating</span>`);R=`${disc}<button onclick="plUpdAsk()">${ic('check',18)}Update orders</button>`}
 else if(mi){L=left(`<span class="wt">${mi} ${mi===1?'customer has':'customers have'} no order yet</span>`);R=`${disc||view(1)}<button onclick="plAddNew()">${ic('plus',18)}Create orders for ${mi} new ${mi===1?'customer':'customers'}</button>`}
 else if(st.setCh){const k=st.kept.length;L=left('<span class="wt">changes not saved</span>'+(k?' · '+k+(k===1?' order is':' orders are')+' already on the way and won’t change':''));R=`${disc}<button onclick="plSaveOnly()">${ic('check',18)}Save changes</button>`}
 else{L=left('');R=view(0)}
 return `<div class="pbar">${L}<div class="row" style="margin:0">${R}</div></div>`;
}
function plSave(){
 const{d,el,sl,dk,dcs,mr,dr}=calc(),old=S.plan[d]||{};
 S.plan[d]={...old,st:'Applied',salad:sl?pn.salad:'',std:pn.std,sc:sl?el.map(c=>c.id):[],mp:{...pn.mp},ov:{...pn.ov},drink:dk?pn.drink:'',dstd:pn.dstd,dc:dcs.map(c=>c.id),dp:{...pn.dp},dov:{...pn.dov},rev:mr+dr};
}
const plMk=(w,d)=>({id:uid(),cid:w.cid,items:w.items,date:d,amt:w.amt,mpr:w.mpr,dpr:w.dpr,status:'New',sid:'',pl:d});
function plDone(msg){pn.st='Applied';pn.msg=msg;save();render();window.scrollTo(0,0)}
function plAddNew(){
 const st=plSt();if(!st||!st.miss.length)return render();const d=pn.date,n=st.miss.length;
 plSave();st.miss.forEach(w=>S.o.unshift(plMk(w,d)));
 plDone('Created '+n+' new '+(n===1?'order':'orders')+' for '+fd(d)+'. Existing orders were not changed.');
}
function plSaveOnly(){plSave();plDone('Plan saved for '+fd(pn.date)+'. No orders needed changes.')}
function plDiscard(){loadPn(pn.date);render()}
function plUpdAsk(){
 const st=plSt();if(!st)return render();const W=new Map(plWant().map(w=>[w.cid,w])),nm=id=>esc(cust(id).name);
 const li=(t,a)=>a.length?`<div class="pll"><b>${t}</b><ul>${a.join('')}</ul></div>`:'';
 const m=$('#md');
 m.innerHTML=`<div class="mdc"><h2 id="mdt">Update orders for ${fd(pn.date)}?</h2>
 ${li('Update '+st.upd.length+(st.upd.length===1?' order':' orders'),st.upd.map(o=>{const w=W.get(o.cid);return `<li>${nm(o.cid)}: ${inr(o.amt)} → ${inr(w.amt)}${o.items!==w.items?' · '+esc(w.items):''}</li>`}))}
 ${li('Create '+st.miss.length+(st.miss.length===1?' order':' orders'),st.miss.map(w=>`<li>${nm(w.cid)}: ${inr(w.amt)}</li>`))}
 ${li('Remove '+st.rem.length+(st.rem.length===1?' order':' orders')+' (no longer in this plan)',st.rem.map(o=>`<li>${nm(o.cid)}: ${inr(o.amt)}</li>`))}
 ${li('Keep '+st.kept.length+(st.kept.length===1?' order':' orders')+' as it is (already assigned or on the way)',st.kept.map(o=>`<li>${nm(o.cid)}: ${esc(o.status)}${o.sid?' · '+esc(staff(o.sid)):''}</li>`))}
 <div class="mu">Orders that are assigned, on the way or delivered are never changed.</div>
 <div class="row"><button class="s" onclick="closeMd()">Cancel</button><button onclick="plUpdDo()">${ic('check',18)}Update orders</button></div></div>`;
 m.hidden=false;
}
function plUpdDo(){
 closeMd();const st=plSt();if(!st)return render();const d=pn.date,W=new Map(plWant().map(w=>[w.cid,w]));
 plSave();
 st.upd.forEach(o=>{const w=W.get(o.cid);if(w)Object.assign(o,{items:w.items,amt:w.amt,mpr:w.mpr,dpr:w.dpr})});
 const rm=new Set(st.rem.map(o=>o.id));if(rm.size)S.o=S.o.filter(o=>!rm.has(o.id));
 st.miss.forEach(w=>S.o.unshift(plMk(w,d)));
 const parts=[st.upd.length?st.upd.length+' updated':'',st.miss.length?st.miss.length+' created':'',st.rem.length?st.rem.length+' removed':''].filter(Boolean).join(', ');
 plDone('Orders for '+fd(d)+': '+(parts||'no changes')+'.'+(st.kept.length?' '+st.kept.length+' assigned or on the way were kept as they are.':''));
}

/* ===== Delete customer from the Edit page (separate, below the form) ===== */
function dzC(c){return `<div class="card dzc"><div class="fsh">${ic('trash',18)}<b>Delete customer</b></div><div class="mu">Removes ${esc(c.name)} from your customer list. Their orders and payments stay in your records. You will be asked to confirm, and you can archive instead.</div><div class="row" style="margin-top:12px"><button class="dzb" onclick="openDel('${c.id}')">${ic('trash',18)}Delete customer…</button></div></div>`}
{const _ev=editV;editV=function(c){return _ev(c)+dzC(c)}}
function archDirect(id){const c=cby(id);if(!c)return;if(tab==='customers'&&cv.v==='edit')cv.v='profile';act(c.name+' archived',()=>{const x=cby(id);x.st='Archived';lg(x,'Customer archived')})}

boot();
